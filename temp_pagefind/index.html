2,"])</script><script>self.__next_f.push([1,"# Login\n\n## Tujuan\n\nGunakan halaman Login untuk masuk ke HRMS dengan email kerja dan kata sandi Anda. Setelah masuk, Anda akan diarahkan ke dasbor (atau area Layanan Mandiri Karyawan jika Anda memiliki peran karyawan).\n\n## Tangkapan layar\n\n![Halaman Login](/manual/pages/login.png)\n\n## Di halaman ini\n\n1. **Logo** — Logo aplikasi di bagian atas kartu.\n2. **Email** — Kolom untuk memasukkan alamat email Anda.\n3. **Kata sandi** — Kolom untuk memasukkan kata sandi Anda.\n4. **Tampilkan/sembunyikan kata sandi** — Tombol untuk beralih antara menyembunyikan dan menampilkan kata sandi.\n5. **Atur Ulang Kata Sandi** — Tautan untuk membuka alur atur ulang kata sandi jika Anda lupa kata sandi.\n6. **Masuk** — Tombol untuk mengirim formulir dan masuk.\n\n## Kontrol\n\n| No | Nama | Fungsi | Catatan |\n|----|------|--------|---------|\n| 1 | Logo | Menampilkan branding aplikasi. | Hanya tampilan. |\n| 2 | Email | Masukkan alamat email Anda. | Harus format email yang valid. |\n| 3 | Kata sandi | Masukkan kata sandi Anda. | Minimal 6 karakter. |\n| 4 | Tampilkan/sembunyikan kata sandi | Mengalihkan visibilitas kata sandi. | Gunakan untuk memeriksa yang Anda ketik. |\n| 5 | Atur Ulang Kata Sandi | Membuka halaman atur ulang kata sandi. | Gunakan jika Anda lupa kata sandi. |\n| 6 | Masuk | Mengirim formulir dan memasukkan Anda. | Nonaktif saat masuk; menampilkan \"Memproses...\". |\n\n## Tugas umum\n\n- **Masuk** — Masukkan email dan kata sandi Anda, lalu klik **Masuk**. Anda akan diarahkan ke dasbor atau ESS sesuai peran Anda.\n- **Buka atur ulang kata sandi** — Klik **Atur Ulang Kata Sandi** untuk meminta tautan atur ulang kata sandi melalui email.\n- **Alihkan visibilitas kata sandi** — Klik ikon mata di samping kolom kata sandi untuk menampilkan atau menyembunyikan kata sandi.\n- **Ubah kata sandi saat login pertama** — Jika ini login pertama Anda, Anda akan diminta mengubah kata sandi sebelum melanjutkan.\n\n## Pemecahan masalah\n\n- **Email tidak valid** — Pastikan Anda memasukkan alamat email yang valid (mis. `nama@perusahaan.com`). Kolom akan menampilkan error jika format salah.\n- **Kata sandi salah** — Jika kata sandi salah, pesan akan muncul. Periksa caps lock dan coba lagi, atau gunakan **Atur Ulang Kata Sandi**.\n- **\"Memproses...\" tidak selesai** — Periksa koneksi internet Anda. Jika berlanjut, coba lagi nanti atau hubungi administrator Anda.\n- **Halaman tidak memuat** — Pastikan Anda menggunakan URL yang benar dan HRMS tersedia. Hubungi IT jika masalah berlanjut.\n- **Tautan Atur Ulang Kata Sandi tidak berfungsi** — Pastikan pop-up tidak diblokir dan Anda menggunakan browser yang didukung. Coba tautan lagi atau hubungi admin Anda."])</script><script>self.__next_f.push([1,"19:[\"$\",\"$1\",\"c\",{\"children\":[[\"$\",\"div\",null,{\"className\":\"x:mx-auto x:flex x:max-w-(--nextra-content-width)\",\"children\":[\"$\",\"$L1c\",null,{\"value\":[{\"value\":\"Tujuan\",\"id\":\"tujuan\",\"depth\":2},{\"value\":\"Tangkapan layar\",\"id\":\"tangkapan-layar\",\"depth\":2},{\"value\":\"Di halaman ini\",\"id\":\"di-halaman-ini\",\"depth\":2},{\"value\":\"Kontrol\",\"id\":\"kontrol\",\"depth\":2},{\"value\":\"Tugas umum\",\"id\":\"tugas-umum\",\"depth\":2},{\"value\":\"Pemecahan masalah\",\"id\":\"pemecahan-masalah\",\"depth\":2}],\"children\":[[\"$\",\"$L1d\",null,{}],[\"$\",\"$L1e\",null,{\"metadata\":{\"title\":\"Login\",\"filePath\":\"src/app/docs/id/manual/pages/login/page.mdx\",\"timestamp\":1772592650000},\"bottomContent\":\"$undefined\",\"sourceCode\":\"$1f\",\"children\":[[\"$\",\"div\",null,{\"id\":\"nextra-skip-nav\"}],[\"$\",\"main\",null,{\"data-pagefind-body\":true,\"children\":[[\"$\",\"h1\",null,{\"id\":\"$undefined\",\"className\":\"x:tracking-tight x:text-slate-900 x:dark:text-slate-100 x:font-bold x:mt-2 x:text-4xl\",\"children\":[\"Login\",\"$undefined\"]}],\"\\n\",\"$L20\",\"\\n\",\"$L21\",\"\\n\",\"$L22\",\"\\n\",\"$L23\",\"\\n\",\"$L24\",\"\\n\",\"$L25\",\"\\
